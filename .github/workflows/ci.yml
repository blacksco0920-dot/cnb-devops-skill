name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validation-only dependencies
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.25.1 PyYAML==6.0.2
      - name: Validate public Skill package
        run: |
          REQUIRE_FULL_JSONSCHEMA=1 python3 -m unittest discover -s tests -v
          python3 -m py_compile scripts/deploydesk_caddy_apply.py scripts/install_shared_caddy_helper.py
          python3 tests/quick_validate.py .
          sudo /usr/sbin/visudo -cf references/shared-caddy-v1/examples/deploydesk-caddy-apply.sudoers
